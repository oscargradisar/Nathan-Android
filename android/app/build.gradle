plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'com.nathan.android'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nathan.android'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.6.0-android.preview'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    signingConfigs {
        release {
            storeFile rootProject.file('release.p12')
            storeType 'PKCS12'
            storePassword (System.getenv('ANDROID_STORE_PASSWORD') ?: '').trim()
            keyAlias 'nathan'
            keyPassword (System.getenv('ANDROID_STORE_PASSWORD') ?: '').trim()
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
chaquopy {
    defaultConfig {
        version '3.13'
        extractPackages 'nathan'
        pip {
            options '--find-links', "${rootDir}/wheels"
            install 'pydantic==2.11.7'
            install 'jiter==0.10.0'
            install 'openai==1.40.0'
            install 'httpx==0.27.2'
            install 'fastapi==0.115.12'
            install 'uvicorn==0.34.3'
            install 'PyYAML==6.0.3'
            install 'python-dotenv==1.1.0'
            install 'platformdirs==4.3.8'
            install 'rich==14.0.0'
            install 'typer==0.16.0'
            install 'pyperclip==1.9.0'
        }
    }
}
