name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  wheels:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ['pydantic_core==2.33.2', 'jiter==0.10.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        id: cache
        with:
          path: wheelhouse
          key: android-cp313-v1-${{ matrix.package }}
      - name: Build Android Python wheels
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          PACKAGE: ${{ matrix.package }}
          CIBW_BUILD: 'cp313-android_*'
          CIBW_ARCHS_ANDROID: 'arm64_v8a x86_64'
          CIBW_TEST_SKIP: '*'
        run: |
          pip install cibuildwheel==3.3.1
          python android/download_source.py
          python -m cibuildwheel --platform android source --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ strategy.job-index }}
          path: wheelhouse/*.whl
  apk:
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: android/wheels
          merge-multiple: true
      - name: Prepare Android sources
        run: python android/prepare.py
      - name: Build APK
        run: gradle -p android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Nathan-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
