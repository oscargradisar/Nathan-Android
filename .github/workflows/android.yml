name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  wheels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ['pydantic_core==2.33.2', 'jiter==0.10.0']
        target:
          - {android: arm64_v8a, rust: aarch64-linux-android, linker: CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER}
          - {android: x86_64, rust: x86_64-linux-android, linker: CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        id: cache
        with:
          path: wheelhouse
          key: android-cp313-v3-${{ matrix.package }}-${{ matrix.target.android }}
      - name: Build Android Python wheels
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          PACKAGE: ${{ matrix.package }}
          CIBW_BUILD: 'cp313-android_${{ matrix.target.android }}'
          CIBW_ARCHS_ANDROID: '${{ matrix.target.android }}'
          CIBW_TEST_SKIP: '*'
          CIBW_BEFORE_BUILD: 'python android/configure_cross.py'
          CIBW_ENVIRONMENT: 'CARGO_BUILD_TARGET=${{ matrix.target.rust }} PYO3_CONFIG_FILE=/tmp/nathan-pyo3.txt'
        run: |
          pip install cibuildwheel==3.3.1
          python android/download_source.py
          python -m cibuildwheel --platform android source --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ strategy.job-index }}
          path: wheelhouse/*.whl
  apk:
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: android/wheels
          merge-multiple: true
      - name: Prepare Android sources
        run: python android/prepare.py
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/release.p12
          gradle -p android assembleDebug assembleRelease --stacktrace
      - name: Allow emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: On-device startup and key-storage smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle -p android connectedDebugAndroidTest --stacktrace
      - name: Collect emulator diagnostics
        if: failure()
        run: adb logcat -d > android-logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-diagnostics
          path: |
            android-logcat.txt
            android/app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: Nathan-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Nathan-Android.apk
          sha256sum Nathan-Android.apk > SHA256SUMS.txt
          gh release create "android-preview-${GITHUB_RUN_NUMBER}" Nathan-Android.apk SHA256SUMS.txt \
            --title "Nathan 1.6.0 Android preview ${GITHUB_RUN_NUMBER}" --prerelease \
            --notes-file android/RELEASE_NOTES.md
